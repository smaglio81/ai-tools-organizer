name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check latest commit message version prefix
        id: check
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: commit message starts with a version prefix: $msg"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: latest commit message does not start with a version prefix: $msg"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

  publish:
    needs: [gate, test]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package -o ai-tools-organizer-v${{ steps.pkg.outputs.version }}.vsix

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ai-tools-organizer-v${{ steps.pkg.outputs.version }}.vsix

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          extensionFile: ai-tools-organizer-v${{ steps.pkg.outputs.version }}.vsix

      - name: Create GitHub release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: ai-tools-organizer-v${{ steps.pkg.outputs.version }}.vsix
